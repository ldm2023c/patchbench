task:
  prompt: |
    Our event-log importer corrupts or rejects valid NDJSON when transport chunks
    do not align with records or UTF-8 code points. It also mishandles CRLF split
    across chunks, final unterminated records, and the byte-size limit. Repair the
    incremental decoder so arbitrary byte chunking produces the same events as
    one-shot input while preserving keepalive blank lines, physical record-number
    errors, max-record enforcement, and closed-stream behavior. See the repository's
    documented contract. Add regression coverage if useful and keep the complete
    suite passing.
