[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchbench"
version = "0.0.1"
description = "A coding agent reliability and failure analysis platform"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.13,<4",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
patchbench = "patchbench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires an available local Docker daemon and test image",
]
